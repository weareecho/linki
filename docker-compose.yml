# Echo fork: github.com/weareecho/linki (from moaljumaa/linki).
# Default uses the published image for a fast first boot. Switch to `build: .`
# when you change Linki source under this directory.
services:
  linki:
    image: moaljumaa/linki:latest
    # To build from this fork instead: comment out image above and uncomment:
    # build: .
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      # Persist SQLite database outside the container
      - ./data:/data
    env_file:
      - .env.local
    environment:
      # Runtime — always set by compose, do not put in .env.local
      - NODE_ENV=production
      - LINKI_DB_PATH=/data/linki.db
      # Echo bridge: INTERNAL_API_SECRET must be set in .env.local so
      # `echoctl linki-check` / `linki-push` can call /api/* over loopback.

    restart: unless-stopped
    # Caps Linki's CPU so a busy runner can't starve other containers on a
    # small box. Raise/remove this if you have cores to spare.
    deploy:
      resources:
        limits:
          cpus: "1.5"
